name: Build APK (Android)

on:
  # Les PR n'executaient rien de ce fichier : un changement de workflow n'etait
  # jamais valide avant d'atterrir sur main. Le portail qualite tourne donc
  # desormais sur PR, sans jamais declencher de publication (voir les `if:`).
  pull_request:
  push:
    branches:
      - main
  # Sans garde, `workflow_dispatch` permettait de publier sur le canal
  # production depuis n'importe quelle branche. La publication est maintenant
  # limitee a main ET demandee explicitement.
  workflow_dispatch:
    inputs:
      publish_ota:
        description: "Publier une mise a jour OTA en production"
        required: true
        type: boolean
        default: false
      build_apk:
        description: "Construire et publier un APK signe"
        required: true
        type: boolean
        default: false
      force_ota:
        description: "Forcer l'OTA malgre un changement natif detecte (exceptionnel)"
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://jzeojdpgglbxjdasjgta.supabase.co' }}
  EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY || 'sb_publishable_82T9HBSLycSJ2T6OBaDNLA_01V1mXda' }}
  EXPO_PUBLIC_APP_URL: ${{ secrets.EXPO_PUBLIC_APP_URL || 'https://buildtrack-mobile.vercel.app' }}
  EXPO_PUBLIC_API_URL: ${{ secrets.BUILDTRACK_API_URL || secrets.EXPO_PUBLIC_APP_URL || 'https://buildtrack-mobile.vercel.app' }}

# Moindre privilege : seul le job qui publie une GitHub Release a besoin
# d'ecrire. Les tests et l'OTA n'en ont aucun usage.
permissions:
  contents: read

jobs:
  # Portail qualite CANONIQUE, partage avec Security gates. Le portail local
  # precedent ne rejouait ni le serveur Next.js, ni la matrice PostgreSQL : un
  # commit pouvait donc etre publie apres avoir satisfait le contrat le plus
  # faible des deux. Saute sur pull_request, ou Security gates les execute deja.
  gates:
    name: Gates
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/reusable-quality-gates.yml

  # Le pipeline garantissait qu'une OTA etait VALIDEE avant publication, pas
  # qu'elle etait NECESSAIRE : le merge d'une PR ne touchant que des workflows
  # republiait un bundle identique sur le canal production.
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      ota_changed: ${{ steps.classify.outputs.ota_changed }}
      native_changed: ${{ steps.classify.outputs.native_changed }}
      server_changed: ${{ steps.classify.outputs.server_changed }}
      workflow_changed: ${{ steps.classify.outputs.workflow_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BEFORE_SHA"
          fi
          # Premier push sur une branche, force-push ou dispatch : pas de base
          # exploitable. On retombe sur le parent, jamais sur « rien change ».
          if [ -z "$base" ]             || [ "$base" = "0000000000000000000000000000000000000000" ]             || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          echo "Base de comparaison : ${base}"
          echo "--- fichiers modifies ---"
          echo "$changed"
          echo "-------------------------"

          match() { echo "$changed" | grep -qE "$1"; }

          # Embarque dans le bundle JS : une OTA suffit a le livrer.
          ota=false
          if match '^(app|components|context|hooks|lib|constants|design-system|assets)/'; then
            ota=true
          fi

          # Peut exiger un nouveau runtime natif. Politique volontairement
          # conservatrice : une dependance ajoutee dans package.json peut
          # embarquer du code natif, et publier une OTA qui en depend rendrait
          # l'application incompatible avec le binaire deja installe.
          native=false
          if match '^(android|ios|plugins)/'             || match '^(app\.json|app\.config\.[a-z]+|eas\.json|package\.json|package-lock\.json|babel\.config\.[a-z]+|metro\.config\.[a-z]+)$'; then
            native=true
          fi

          server=false
          if match '^(vercel-app|supabase|cloudflare|server)/'; then
            server=true
          fi

          workflow=false
          if match '^\.github/'; then
            workflow=true
          fi

          {
            echo "ota_changed=${ota}"
            echo "native_changed=${native}"
            echo "server_changed=${server}"
            echo "workflow_changed=${workflow}"
          } >> "$GITHUB_OUTPUT"

          echo "### Classification" >> "$GITHUB_STEP_SUMMARY"
          echo "| Categorie | Modifie |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Bundle JS (OTA) | ${ota} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Runtime natif | ${native} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Serveur / SQL | ${server} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Workflows | ${workflow} |" >> "$GITHUB_STEP_SUMMARY"

  # ─── Job 1 : OTA update (JS bundle uniquement) ───────────────────────────
  # Publie le bundle JS via EAS Update (expo-updates).
  # Ne nécessite PAS de build natif → s'exécute en ~2-3 min.
  # Prérequis : secret EXPO_TOKEN dans les settings GitHub du dépôt.
  publish-ota:
    name: Publish OTA Update (EAS)
    runs-on: ubuntu-latest
    needs: [gates, detect-changes]
    # Une PR ne livre jamais aux utilisateurs, un dispatch depuis une branche
    # non fusionnee non plus, et un commit sans changement de bundle ne
    # republie plus a l'identique.
    #
    # `native_changed` bloque l'OTA automatique : livrer un bundle qui depend
    # d'un module natif absent du binaire installe casserait l'application sur
    # les appareils. `force_ota` permet de passer outre en connaissance de cause.
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        (
          github.event_name == 'push' &&
          needs.detect-changes.outputs.ota_changed == 'true' &&
          needs.detect-changes.outputs.native_changed != 'true'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.publish_ota &&
          (needs.detect-changes.outputs.native_changed != 'true' || inputs.force_ota)
        )
      )
    environment: mobile-release
    # Publie automatiquement quand EXPO_TOKEN est configuré. Sans secret, le
    # job reste vert et l'APK natif continue d'être produit.
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish OTA update
        if: env.EXPO_TOKEN != ''
        run: npx eas-cli@22.2.0 update --channel production --message "OTA auto — build ${{ github.run_number }} (${{ github.sha }})" --non-interactive

      - name: Report unavailable OTA credentials
        if: env.EXPO_TOKEN == ''
        run: echo "EXPO_TOKEN absent; APK build remains available but OTA was not published."

  # ─── Job 2 : Build APK natif ─────────────────────────────────────────────
  # Reconstruit le APK complet (natif + JS). Nécessaire uniquement quand
  # des modules natifs changent. Les correctifs JS-only passent par OTA.
  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: [gates, detect-changes]
    # Un commit de documentation ou de workflow ne declenche plus un build de
    # 28 minutes qui echouerait de toute facon sur les secrets de signature.
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        (
          github.event_name == 'push' &&
          needs.detect-changes.outputs.native_changed == 'true'
        ) ||
        (github.event_name == 'workflow_dispatch' && inputs.build_apk)
      )
    environment: mobile-release
    # Publication de la GitHub Release : seul endroit qui exige l'ecriture.
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Stamp Android build number
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          const buildNumber = Number.parseInt(process.env.BUILD_NUMBER || '', 10);
          if (!Number.isSafeInteger(buildNumber) || buildNumber <= 0) {
            throw new Error('Invalid GitHub run number for Android versionCode');
          }
          config.expo.android.versionCode = buildNumber;
          fs.writeFileSync('app.json', `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;36.0.0 platforms;android-36

      - name: Accept all Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install dependencies
        run: npm ci

      - name: Configure Android push services
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const raw = process.env.GOOGLE_SERVICES_JSON || '';
          if (!raw.trim()) process.exit(0);
          let content = raw.trim();
          if (!content.startsWith('{')) {
            content = Buffer.from(content, 'base64').toString('utf8').trim();
          }
          JSON.parse(content);
          fs.writeFileSync('google-services.json', `${content}\n`);
          NODE

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Force JS bundle embedding in APK
        run: |
          cat >> android/gradle.properties <<'EOF'

          bundleInDebug=true
          hermesEnabled=true
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m
          org.gradle.workers.max=2
          systemProp.org.gradle.internal.http.connectionTimeout=60000
          systemProp.org.gradle.internal.http.socketTimeout=120000
          EOF

      # L'APK release etait signe avec la cle debug d'Android, publiquement
      # connue : n'importe qui pouvait produire une mise a jour acceptee par les
      # appareils. Un keystore release est desormais exige.
      - name: Verify release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "$(printenv "$name")" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "::error::Secret(s) de signature release absent(s) :${missing}"
            echo "::error::Creer un keystore release puis l'enregistrer dans les secrets du depot."
            echo "::error::  keytool -genkeypair -v -keystore buildtrack-release.jks -keyalg RSA -keysize 4096 -validity 10000 -alias buildtrack"
            echo "::error::  base64 -w0 buildtrack-release.jks   # -> ANDROID_KEYSTORE_BASE64"
            echo "::error::Le build est volontairement bloque : publier un APK signe avec la cle debug n'est pas acceptable."
            exit 1
          fi

      - name: Decode and verify release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keystore="${RUNNER_TEMP}/buildtrack-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${keystore}"
          if [ ! -s "${keystore}" ]; then
            echo "::error::Keystore vide apres decodage base64 — le secret ANDROID_KEYSTORE_BASE64 est invalide."
            exit 1
          fi
          # Ouvrir reellement le keystore avec le mot de passe ET l'alias : sans
          # cela, un mot de passe errone, un alias inexistant ou un base64
          # tronque ne se manifestaient qu'en echec Gradle opaque, une demi-heure
          # de build plus tard.
          if ! keytool -list -keystore "${keystore}" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Keystore illisible : mot de passe incorrect, alias '${ANDROID_KEY_ALIAS}' absent, ou fichier corrompu."
            echo "::error::Verifier avec : keytool -list -keystore <fichier> -alias <alias>"
            exit 1
          fi
          # Empreinte du certificat : trace permettant de confirmer que toutes
          # les releases sont bien signees avec la MEME cle.
          echo "Empreinte du certificat de signature :"
          keytool -list -v -keystore "${keystore}" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" \
            | grep -E 'SHA256:|Valid from' || true

      - name: Configure release signing
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Les identifiants transitent par gradle.properties (non versionne,
          # detruit avec le runner) plutot que par le build.gradle genere.
          cat >> gradle.properties <<EOF

          BUILDTRACK_RELEASE_STORE_FILE=${RUNNER_TEMP}/buildtrack-release.jks
          BUILDTRACK_RELEASE_STORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}
          BUILDTRACK_RELEASE_KEY_ALIAS=${ANDROID_KEY_ALIAS}
          BUILDTRACK_RELEASE_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}
          EOF
          cat >> app/build.gradle << 'EOF'

          android.signingConfigs.create("buildtrackRelease") {
              storeFile file(project.property("BUILDTRACK_RELEASE_STORE_FILE"))
              storePassword project.property("BUILDTRACK_RELEASE_STORE_PASSWORD")
              keyAlias project.property("BUILDTRACK_RELEASE_KEY_ALIAS")
              keyPassword project.property("BUILDTRACK_RELEASE_KEY_PASSWORD")
          }
          android.buildTypes.release.signingConfig = android.signingConfigs.buildtrackRelease
          EOF

      - name: Build APK
        working-directory: android
        run: |
          for attempt in 1 2 3; do
            echo "Gradle build attempt ${attempt}/3"
            if ./gradlew assembleRelease --no-daemon --stacktrace; then
              exit 0
            fi

            if [ "${attempt}" -eq 3 ]; then
              echo "Gradle build failed after 3 attempts."
              exit 1
            fi

            sleep $((attempt * 15))
          done

      - name: Find APK location
        run: find android/app/build/outputs/apk -name "*.apk" | tee apk-paths.txt

      - name: Stage APK with stable name
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/release/*.apk release-assets/buildtrack-release.apk
          ls -lh release-assets/

      - name: Create release metadata
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node - <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          const apk = fs.readFileSync('release-assets/buildtrack-release.apk');
          const buildNumber = Number.parseInt(process.env.BUILD_NUMBER || '', 10);
          if (!Number.isSafeInteger(buildNumber) || buildNumber <= 0) {
            throw new Error('Invalid release build number');
          }
          const tag = `android-build-${buildNumber}`;
          const repository = process.env.REPOSITORY;
          const downloadUrl = `https://github.com/${repository}/releases/download/${tag}/buildtrack-release.apk`;
          const manifest = {
            schemaVersion: 1,
            buildNumber,
            version: config.expo.version,
            tag,
            commit: process.env.COMMIT_SHA,
            publishedAt: new Date().toISOString(),
            downloadUrl,
            apk: {
              name: 'buildtrack-release.apk',
              url: downloadUrl,
              size: apk.byteLength,
              sha256: crypto.createHash('sha256').update(apk).digest('hex'),
            },
          };
          fs.writeFileSync('release-assets/buildtrack-release.json', `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          cat release-assets/buildtrack-release.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: buildtrack-release.apk
          path: release-assets/buildtrack-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish APK as public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: BuildTrack Android — Build ${{ github.run_number }}
          body: |
            Build Android automatique #${{ github.run_number }}
            Commit : ${{ github.sha }}

            Téléchargement direct (pointe toujours vers la dernière version) :
            https://github.com/${{ github.repository }}/releases/latest/download/buildtrack-release.apk
          files: |
            release-assets/buildtrack-release.apk
            release-assets/buildtrack-release.json
          make_latest: 'true'
          prerelease: false
