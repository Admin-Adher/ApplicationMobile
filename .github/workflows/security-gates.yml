name: Security gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application-contracts:
    name: Application security contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vercel-app/package-lock.json

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Install canonical server dependencies from lockfile
        working-directory: vercel-app
        run: npm ci

      - name: Run application and tenant-isolation contracts
        run: npm test

      - name: Type-check Expo application
        run: npx tsc --noEmit --pretty false

      - name: Type-check canonical Next.js server
        working-directory: vercel-app
        run: npx tsc --noEmit --pretty false

  postgres-tenant-matrix:
    name: PostgreSQL user A x object B matrix
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: buildtrack_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d buildtrack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: buildtrack_test
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          if command -v psql >/dev/null 2>&1; then
            psql --version
            exit 0
          fi

          # GitHub-hosted images can temporarily expose unrelated third-party
          # repositories that return 403 during apt update. Disable only those
          # Microsoft feeds; PostgreSQL comes from the signed Ubuntu archive.
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \
            \( -name '*microsoft*' -o -name '*azure*' \) \
            -exec mv '{}' '{}.disabled' \;
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Bootstrap disposable Supabase catalogue
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap_tenant_isolation.sql

      - name: Apply production inventory module migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260809140643_add_inventory_module.sql

      - name: Apply production authority migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260810192253_organization_membership_authority.sql

      - name: Apply production tenant-integrity migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260810193111_enforce_tenant_integrity_and_rpc_scope.sql

      - name: Apply production private-media migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260810193713_add_private_tenant_media_registry.sql

      - name: Apply production tenant-index and legacy-helper hardening
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260811000500_index_tenant_fks_and_harden_legacy_helpers.sql

      - name: Pin chantier visibility helper search path
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260811001700_fix_chantier_visibility_search_path.sql

      - name: Apply private-channel UUID membership migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260812162402_migrate_private_channel_members_to_user_ids.sql

      - name: Remove legacy name-based messaging policies
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260812170011_remove_legacy_name_based_messaging_policies.sql

      - name: Optimize private-channel UUID policies
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260812170144_optimize_private_channel_uuid_policies.sql

      - name: Harden private-channel management scope
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260812170600_harden_private_channel_management.sql

      - name: Reconcile the empty legacy DM alias
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260812171000_reconcile_empty_legacy_dm_alias.sql

      - name: Harden inventory operation idempotency
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260814102326_harden_inventory_operation_idempotency.sql

      - name: Execute user A x object B matrix
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/tenant_isolation_matrix.sql

      - name: Execute inventory idempotency matrix
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/inventory_operation_idempotency.sql
