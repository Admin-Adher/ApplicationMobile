name: Security gates

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Appelant mince : la definition vit dans reusable-quality-gates.yml, partagee
  # avec la chaine de release. Le trigger `push` a ete retire volontairement —
  # sur main, c'est `build-apk.yml` qui execute ces memes controles avant de
  # publier, les rejouer ici les executerait deux fois pour rien.
  gates:
    name: Gates
    uses: ./.github/workflows/reusable-quality-gates.yml
